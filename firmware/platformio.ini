; S3 Phone Radio Console — firmware
;
; Headless ESP32-S3 radio. Phone is the UI, the disk and the brain.
; Transport: USB serial (primary) + BLE GATT (cableless mode). Same frame format
; on both, so the phone app is unchanged whichever link is up.
; Nothing is persisted on the device.
;
; Design constraint this build is shaped around:
;   ESP32-S3 has ONE 2.4 GHz radio, time-division multiplexed between Wi-Fi and BLE.
;   Espressif's own coexistence table (ESP-IDF v6.1 api-guides/coexist.html) rates
;   "Wi-Fi Sniffer RX + BLE" as C1 = supported but UNSTABLE, in every BLE mode.
;   Normal STA Wi-Fi + BLE is stable (Y). So: never stream while sniffing.
;   Capture into PSRAM with BLE idle; sync at stage boundaries.
;
; Board: ESP32-S3-DevKitC-1 N16R8 — 16 MB flash, 8 MB octal PSRAM (the capture buffer).
;
; Build:  pio run -e s3-n16r8
; Flash:  pio run -e s3-n16r8 -t upload --upload-port /dev/ttyUSB0

[platformio]
default_envs = s3-n16r8

; ---------------------------------------------------------------------------
; Base: pioarduino platform on IDF 5.5. Required for raw 802.11 frame injection
; (promiscuous mode + esp_wifi_80211_tx) — the stock espressif32 platform does
; not expose it. Same platform + libs NRSuite uses, proven on this exact board.
; ---------------------------------------------------------------------------
[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.1

[common_flags]
build_flags =
    -DCONFIG_AUTOSTART_ARDUINO=1

    ; Raw 802.11 — promiscuous mode + frame injection
    -DCONFIG_ESP_WIFI_SOFTAP_SUPPORT=1
    -DCONFIG_ESP_WIFI_ENABLE_WPA2=1
    -DCONFIG_ESP_WIFI_ENABLE_SNIFFER=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check
    ; Override the WiFi driver's frame-type gate — our definition wins
    -Wl,--allow-multiple-definition

    ; Size
    -ffunction-sections
    -fdata-sections
    -Os
    -Wl,--gc-sections

    -DGIT_COMMIT_HASH='"dev"'
    -DCORE_DEBUG_LEVEL=0

    ; send_frame() builds the whole frame — header plus up to 4096 bytes of
    ; payload — in a local buffer, and reply_json() stacks another 2 KB on top of
    ; it. That is ~6 KB of stack in a single call chain against an 8 KB default,
    ; which was survivable while every command was small. capture_get() now walks
    ; a burst of frames through that same path, so the margin is gone. 16 KB.
    -DARDUINO_LOOP_STACK_SIZE=16384

; ---------------------------------------------------------------------------
; ESP32-S3-DevKitC-1 N16R8 — the bench board this was proven on.
; 16 MB flash / 8 MB OCTAL PSRAM (qio_opi). PSRAM is ON here: it is the capture
; buffer the whole design depends on. (NRSuite disables it; we cannot.)
; ---------------------------------------------------------------------------
[env:s3-n16r8]
extends           = base, common_flags
board             = esp32-s3-devkitc1-n16r8
board_build.mcu   = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_n16r8.csv
build_src_filter  = +<*> -<rxtest_main.cpp>
build_flags =
    ${common_flags.build_flags}
    -DSRC_DEBUG=1
    -DCHIP_NAME='"ESP32-S3"'

    ; ── USB mode: USB-OTG / TinyUSB, deliberately CDC-only ─────────────────────
    ; Careful — the core's ARDUINO_USB_MODE is inverted from what the name
    ; suggests. Verified in cores/esp32/HardwareSerial.h and USBCDC.cpp rather
    ; than assumed:
    ;
    ;   ARDUINO_USB_MODE=1  ->  "Hardware JTAG CDC" (HWCDC, USB-Serial/JTAG)
    ;   ARDUINO_USB_MODE=0  ->  "Native USB Mode"   (TinyUSB / USB-OTG, USBCDC)
    ;
    ; 0 (TinyUSB) is the right pick here, and not a guess: it is what NRSuite
    ; builds with, and its Android app really does talk to the board over the
    ; native USB port. It is also the mode BadUSB / HID / MSC will need later, so
    ; the platform is already the right shape.
    ;
    ; Why CDC *only*: with CDC on boot and no MSC/HID on boot, the device
    ; enumerates as a plain single-function CDC-ACM. Advertising a composite
    ; (CDC + HID + MSC) makes Android offer to mount the mass-storage function and
    ; complicates the USB permission flow the app depends on.
    ;
    ; NOTE the core also defines ARDUINO_USB_MODE; ours appears later on the
    ; command line and wins. The "redefined" build warning is expected — confirmed
    ; by dumping the -v command line, which shows both values.
    ;
    ; Operational consequence of TinyUSB, worth knowing before it bites:
    ; **esptool cannot auto-reset over the native USB port in this mode.** To flash
    ; over that port, hold BOOT and tap RESET. The UART/bridge port (CH34x)
    ; auto-resets normally — that is how this project flashes.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Standalone nRF24 RX — diagnosis only, NOT part of the product.
;
; Same platform, board and board settings as s3-n16r8, but builds ONLY
; src/rxtest_main.cpp: raw SPI, no lib/nrf24, no protocol, no WiFi. Its whole
; job is to answer one question that register read-back cannot — is the receive
; failure in our driver or in the module. Serial0 (UART0) only.
;
;   pio run -e s3-rxtest -t upload --upload-port /dev/ttyACM1
; ---------------------------------------------------------------------------
[env:s3-rxtest]
extends           = base
board             = esp32-s3-devkitc1-n16r8
board_build.mcu   = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_n16r8.csv
build_src_filter = -<*> +<rxtest_main.cpp>
build_flags =
    -DCONFIG_AUTOSTART_ARDUINO=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os
