; S3 Phone Radio Console — firmware
;
; Headless ESP32-S3 radio. Phone is the UI, the disk and the brain.
; Transport: BLE GATT. Nothing is persisted on the device.
;
; Design constraint this build is shaped around:
;   ESP32-S3 has ONE 2.4 GHz radio, time-division multiplexed between Wi-Fi and BLE.
;   Espressif's own coexistence table (ESP-IDF v6.1 api-guides/coexist.html) rates
;   "Wi-Fi Sniffer RX + BLE" as C1 = supported but UNSTABLE, in every BLE mode.
;   Normal STA Wi-Fi + BLE is stable (Y). So: never stream while sniffing.
;   Capture into PSRAM with BLE idle; sync at stage boundaries.
;
; Board: ESP32-S3-DevKitC-1 N16R8 — 16 MB flash, 8 MB octal PSRAM (the capture buffer).
;
; Build:  pio run -e s3-n16r8
; Flash:  pio run -e s3-n16r8 -t upload --upload-port /dev/ttyUSB0

[platformio]
default_envs = s3-n16r8

; ---------------------------------------------------------------------------
; Base: pioarduino platform on IDF 5.5. Required for raw 802.11 frame injection
; (promiscuous mode + esp_wifi_80211_tx) — the stock espressif32 platform does
; not expose it. Same platform + libs NRSuite uses, proven on this exact board.
; ---------------------------------------------------------------------------
[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.1

[common_flags]
build_flags =
    -DCONFIG_AUTOSTART_ARDUINO=1

    ; Raw 802.11 — promiscuous mode + frame injection
    -DCONFIG_ESP_WIFI_SOFTAP_SUPPORT=1
    -DCONFIG_ESP_WIFI_ENABLE_WPA2=1
    -DCONFIG_ESP_WIFI_ENABLE_SNIFFER=1
    -Wl,--wrap=ieee80211_raw_frame_sanity_check

    ; Size
    -ffunction-sections
    -fdata-sections
    -Os
    -Wl,--gc-sections

    -DGIT_COMMIT_HASH='"dev"'
    -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; ESP32-S3-DevKitC-1 N16R8 — Brad's board, on the bench, proven.
; 16 MB flash / 8 MB OCTAL PSRAM (qio_opi). PSRAM is ON here: it is the capture
; buffer the whole design depends on. (NRSuite disables it; we cannot.)
; ---------------------------------------------------------------------------
[env:s3-n16r8]
extends           = base, common_flags
board             = esp32-s3-devkitc-1
board_build.mcu   = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_n16r8.csv
build_flags =
    ${common_flags.build_flags}
    -DBOARD_HAS_PSRAM=1
    -DCONFIG_SPIRAM=1
    -DCHIP_NAME='"ESP32-S3"'
    ; Native USB-OTG (BadUSB / HID / MSC). Also the flashing + serial path.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_TINYUSB_ENABLED=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_HID_ENABLED=1
    -DCONFIG_TINYUSB_MSC_ENABLED=1
