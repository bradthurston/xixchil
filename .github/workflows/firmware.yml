name: firmware

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      write_back:
        description: 'Commit the rebuilt images into docs/ (normally only happens on a tag)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  merged-images:
    name: merged flash images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The Espressif toolchain is a few hundred MB and barely changes. Without this cache
      # every run pays for it again.
      - name: cache platformio
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      # esptool explicitly as well: PlatformIO bundles its own copy as a *package*
      # (tool-esptoolpy/esptool.py) with no console script on PATH, which is why the first run
      # of this workflow died with "esptool not found".
      - name: install platformio
        run: python -m pip install --upgrade platformio esptool

      # Builds both environments and merges each into one image at offset 0, using the
      # offsets read off the build — see the header of the script for why the C5's
      # bootloader being at 0x2000 instead of 0x0 matters.
      - name: build and merge
        run: firmware/merge_bins.sh

      - name: hashes
        run: |
          {
            echo '## Merged firmware images'
            echo
            echo '| image | bytes | sha256 |'
            echo '|---|---|---|'
            for f in docs/xixchil-*-merged.bin; do
              printf '| `%s` | %s | `%s` |\n' "$(basename "$f")" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: xixchil-merged-images
          path: docs/xixchil-*-merged.bin
          if-no-files-found: error

      # One builder, one artifact. CI rebuilds these images, so CI also owns the copy the
      # flasher page serves — otherwise the page and a release asset quietly diverge and only
      # one of them ever gets looked at. Runs on a tag, or when a dispatch asks for it.
      #
      # The images come from the ref that was checked out (the tag), but the commit has to
      # land on main. So: keep the built files, move to main, drop them in, and let
      # firmware/update_flash_doc.py rewrite the documented hashes from the files themselves.
      - name: write the images back into docs/
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.write_back == 'true'
        env:
          # ref_name comes through the environment, never interpolated into the script:
          # a tag name is attacker-controlled input on a public repo.
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/built
          cp docs/xixchil-*-merged.bin /tmp/built/

          git fetch --quiet origin main
          git checkout -B main origin/main
          cp /tmp/built/*.bin docs/
          python3 firmware/update_flash_doc.py

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/

          if git diff --cached --quiet; then
            echo "docs/ already matches the rebuilt images — nothing to commit"
            exit 0
          fi

          git commit \
            -m "firmware: rebuild the flash images for ${REF}" \
            -m "Built and merged by the firmware workflow from ${REF}, so the image the flasher page serves is the one this run produced. Hashes in docs/WEBFLASH.md are rewritten from the files. Builds are not bit-reproducible across machines, so these bytes differ from a locally built copy of the same source — that is expected; see docs/WEBFLASH.md."
          git push origin main

      # On a tag, publish the images with the release so the artifact is reproducible from
      # the source tree alone. The APK is deliberately still built and signed by hand:
      # signing needs a keystore, and putting that in repo secrets is a decision rather than
      # a default.
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            printf '%s\n' \
              'Firmware images for this tag, built by CI from this commit.' \
              '' \
              'Flash either image at offset 0 — each contains the bootloader, partition table' \
              'and application. A signed APK for the phone half is attached separately.' \
              > /tmp/notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          fi
          gh release upload "$TAG" docs/xixchil-*-merged.bin --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'
