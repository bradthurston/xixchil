<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#100E0A">
<script>
  // Applied before first paint: someone who chose paper must never see the ink
  // theme flash on every launch.
  try {
    if (localStorage.getItem('xixchil-theme') === 'paper') {
      document.documentElement.setAttribute('data-theme', 'paper');
      document.querySelector('meta[name="color-scheme"]').content = 'light';
      document.querySelector('meta[name="theme-color"]').content = '#DED2B2';
    }
  } catch (e) {}
</script>
<title>Xixchil</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">

  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 13v8"/><path d="M5.5 9.5a9 9 0 0 1 13 0"/>
      <path d="M8.5 12.5a5 5 0 0 1 7 0"/><circle cx="12" cy="12" r="1.2"/>
    </svg>
    <h1>Xixchil</h1>
    <span class="pill" id="connPill"><span class="dot"></span>offline</span>
    <button id="themeBtn" class="pill ghost" style="margin-left:auto;font-size:11px;padding:3px 9px"
            title="Ink or paper" aria-label="Switch between ink and paper" aria-pressed="false">
      <svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true">
        <circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M6 1.4a4.6 4.6 0 0 0 0 9.2z" fill="currentColor"/>
      </svg>
      <span id="themeName">paper</span>
    </button>
    <button id="resetBtn" class="pill ghost" style="font-size:11px;padding:2px 8px">reset</button>
  </header>

  <main>

    <!-- ── connect ─────────────────────────────────────────────── -->
    <section class="card" id="connectCard">
      <h2>Device</h2>
      <div id="deviceList"></div>
      <button class="block ghost" id="refreshBtn" style="margin-top:10px"></button>
    </section>

    <!-- ── console ─────────────────────────────────────────────── -->
    <section class="card hidden" id="consoleCard">
      <h2>Link</h2>
      <div id="deviceInfo"></div>
      <div class="row" style="margin-top:12px">
        <button id="pingBtn"></button>
        <button class="ghost" id="linkBtn"></button>
      </div>
    </section>

    <!-- ── staged flow ─────────────────────────────────────────── -->
    <section class="card hidden" id="consoleCard2">
      <h2>Flow</h2>
      <div class="stages" id="stages"></div>
    </section>

    <section class="card hidden" id="consoleCard3">
      <div id="stagePanel"></div>
    </section>

    <!-- ── import ──────────────────────────────────────────────── -->
    <!-- Deliberately outside the device-gated cards: a handshake can be imported and
         cracked with no board attached. This is the door another tool's export comes
         through — NRSuite's portal writes one, and cracking it is this app's half. -->
    <section class="card" id="importCard">
      <h2>Import capture</h2>
      <div class="stagesub">Bring in a handshake from another tool — a .22000 list or a
        capture file (.pcap / .cap / .pcapng). No device needed; the search runs on the bridge.</div>
      <input type="file" id="importFile"
             accept=".22000,.pcap,.cap,.pcapng,.txt,application/octet-stream" hidden>
      <button class="block" id="importBtn" style="margin-top:10px"></button>
      <div id="importResult"></div>
    </section>

    <!-- ── wardrive ───────────────────────────────────────────── -->
    <section class="card hidden" id="wardriveCard">
      <h2>Wardrive</h2>
      <button id="wardriveBtn">Start Wardrive</button>
      <div id="wardriveStatus" class="hidden">
        <div class="wrow">GPS: <span id="gpsStatus">no fix</span></div>
        <div class="wrow">Frames: <span id="wFrames">0</span></div>
        <div class="wrow">APs: <span id="wAPs">0</span></div>
        <div class="wrow">Deauths: <span id="wDeauths">0</span></div>
        <div class="wrow">Handshakes: <span id="wHandshakes">0</span></div>
        <div class="wrow">Duration: <span id="wDuration">0s</span></div>
      </div>
      <div id="wardriveLog" style="max-height:100px; overflow-y:auto; font-size:11px; margin-top:10px;"></div>
    </section>

    <!-- ── log ─────────────────────────────────────────────────── -->
    <section class="card">
      <h2>Trace</h2>
      <pre id="log"></pre>
    </section>

  </main>
</div>

<script src="./js/bridge-defaults.js" onerror="window.BRIDGE_DEFAULTS=window.BRIDGE_DEFAULTS||{}"></script>
<script src="./js/gps.js"></script>
<script src="./js/hashstore.js"></script>
<script src="./js/wardrive.js"></script>
<script type="module" src="./js/app.js"></script>
<script>
  // Theme toggle on consoleCard visibility — hides flow cards when disconnected.
  const syncCards = () => {
    const on = document.getElementById('consoleCard').classList.contains('hidden') === false;
    ['consoleCard2', 'consoleCard3'].forEach((id) =>
      document.getElementById(id).classList.toggle('hidden', !on));
  };
  new MutationObserver(syncCards)
    .observe(document.getElementById('consoleCard'), { attributes: true, attributeFilter: ['class'] });
  window.addEventListener('DOMContentLoaded', syncCards);

  // Ink (default) or paper. The choice is persisted and re-applied pre-paint
  // by the script in <head>; this only handles the switch and the label.
  const themeBtn = document.getElementById('themeBtn');
  const themeName = document.getElementById('themeName');
  const isPaper = () => document.documentElement.getAttribute('data-theme') === 'paper';
  const applyTheme = (paper) => {
    if (paper) document.documentElement.setAttribute('data-theme', 'paper');
    else document.documentElement.removeAttribute('data-theme');
    document.querySelector('meta[name="color-scheme"]').content = paper ? 'light' : 'dark';
    document.querySelector('meta[name="theme-color"]').content = paper ? '#DED2B2' : '#100E0A';
    // the label names the theme you get by pressing it
    themeName.textContent = paper ? 'ink' : 'paper';
    themeBtn.setAttribute('aria-pressed', String(paper));
    try { localStorage.setItem('xixchil-theme', paper ? 'paper' : 'ink'); } catch (e) {}
  };
  themeBtn.addEventListener('click', () => applyTheme(!isPaper()));
  applyTheme(isPaper());
</script>
</body>
</html>
